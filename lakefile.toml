name = "hgas-formalization"
version = "0.1.0"
defaultTargets = ["HGAS"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false
warningAsError = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.30.0"

[[lean_lib]]
name = "HGAS"

[[lean_lib]]
name = "Stability"
